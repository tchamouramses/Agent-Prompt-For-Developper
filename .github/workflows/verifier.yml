name: Vérifier la bibliothèque

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Agents et version Codex synchronisés
        run: python3 scripts/sync-agents.py --check
      - name: Skills valides et références des agents
        run: python3 scripts/validate-skills.py
      - name: Cas d'essai du hook des actions réservées
        run: python3 scripts/test-hook-actions-reservees.py
      - name: Cas d'essai de l'installation
        run: python3 scripts/test-install.py

name: Publier sur npm

# Publie le paquet @tchamouramses/agents-dev quand un tag vX.Y.Z est poussé.
# Prérequis : un jeton npm d'automatisation dans le secret NPM_TOKEN du dépôt.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Le tag correspond à la version de package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, version $VERSION : mettre package.json à jour avant de taguer." >&2; exit 1; }
      - name: Vérifications
        run: |
          python3 scripts/sync-agents.py --check
          python3 scripts/validate-skills.py
          npm test
      - name: Publication
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
